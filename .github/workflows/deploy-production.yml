name: Deploy to Production

# Deploys https://bookie.knowall.ai when a release tag (v*) is pushed, or on demand.
# The build and deploy are infra/web/deploy.sh, the same script used from a laptop:
# a clean worktree build of the ref, a zip of the Next standalone output,
# `az webapp deploy --clean true`, then a wait until the live site serves the new
# BUILD_ID.
#
# Azure sign-in is OpenID Connect (no stored password). Repository secrets:
#   AZURE_CLIENT_ID        app registration / managed identity with a federated
#                          credential for this repo's `production` environment
#   AZURE_TENANT_ID        its Entra tenant
#   AZURE_SUBSCRIPTION_ID  the subscription holding the App Service
# See docs/DEPLOYMENT.adoc for the one-off setup.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  deploy-production:
    name: Deploy to bookie.knowall.ai
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: production
      url: https://bookie.knowall.ai
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Get release info
        id: release
        run: |
          echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # deploy.sh fetches and adds a git worktree for the ref, so it needs full history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy
        run: infra/web/deploy.sh "$DEPLOY_SHA"
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}

      - name: Summary
        if: success()
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "## Production deployment complete"
            echo ""
            echo "**Version:** ${RELEASE_REF}"
            echo "**URL:** https://bookie.knowall.ai"
            echo "**Commit:** \`${RELEASE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
