name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      # Unit tests with coverage; fails if coverage drops below the thresholds in vitest.config.ts.
      - run: bun run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          f=coverage/coverage-summary.json
          [ -f "$f" ] || { echo "No coverage summary written." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## Unit test coverage"
            echo ""
            echo "| Metric | Covered | Total | % |"
            echo "|---|---:|---:|---:|"
            for m in statements branches functions lines; do
              jq -r --arg m "$m" '.total[$m] | "| \($m) | \(.covered) | \(.total) | \(.pct) |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-summary
          path: web/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXTAUTH_URL: https://getbook.ie

  e2e:
    name: End-to-end, ${{ matrix.project }} (demo organisations)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Project names from web/playwright.config.ts; mobile runs the @mobile specs.
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: web/playwright-report
          retention-days: 7

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI is free for organisations (the GitHub Action needs a licence).
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
